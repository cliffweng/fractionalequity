<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractional Equity</title>
    <meta name="description" content="Private family office. We do not solicit or accept outside capital or clients.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f4f6f8',
                            100: '#e4e8ec',
                            200: '#c5ced6',
                            300: '#a6b3bf',
                            400: '#6a7f91',
                            500: '#2e4a64', // Primary Navy
                            600: '#29435a',
                            700: '#22384b',
                            800: '#1c2e3d',
                            900: '#172531',
                        },
                        accent: {
                            500: '#c5a059', // Gold/Bronze
                            600: '#b08d4b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-50 text-brand-800 font-sans antialiased min-h-screen flex flex-col">

    <nav class="w-full border-b border-brand-100 bg-white">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
            <a href="index.html" class="font-serif text-lg font-semibold text-brand-900">Fractional Equity</a>
            <a href="login.html" class="text-sm text-brand-500 hover:text-accent-600 transition-colors">Member Login</a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md text-center">
            <h1 class="font-serif text-4xl sm:text-5xl font-semibold text-brand-900 tracking-tight">Fractional Equity</h1>
            <div class="w-12 h-px bg-accent-500 mx-auto my-6"></div>
            <p class="text-brand-500 font-light text-lg">Private family office. We do not solicit or accept outside capital or clients.</p>

            <div class="mt-12 text-center bg-white border border-brand-100 rounded-lg shadow-sm p-6 sm:p-8">
                <h2 class="font-serif text-xl text-brand-900">Contact</h2>
                <p class="mt-3 text-sm text-brand-600">For existing relationships and vendors only.</p>
                <p class="mt-2 text-sm">
                    <a href="mailto:hello@fractionalequity.com" class="inline-flex items-center gap-2 text-brand-500 hover:text-accent-600 transition-colors">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                        hello@fractionalequity.com
                    </a>
                </p>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-brand-400">
        &copy; Fractional Equity
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
