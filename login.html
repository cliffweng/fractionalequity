<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | Fractional Equity</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f4f6f8',
                            100: '#e4e8ec',
                            200: '#c5ced6',
                            300: '#a6b3bf',
                            400: '#6a7f91',
                            500: '#2e4a64', // Primary Navy
                            600: '#29435a',
                            700: '#22384b',
                            800: '#1c2e3d',
                            900: '#172531',
                        },
                        accent: {
                            500: '#c5a059', // Gold/Bronze
                            600: '#b08d4b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-50 text-brand-800 font-sans antialiased min-h-screen flex flex-col">

    <nav class="w-full border-b border-brand-100 bg-white">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
            <a href="index.html" class="font-serif text-lg font-semibold text-brand-900">Fractional Equity</a>
            <div class="flex items-center gap-5 text-sm">
                <a href="index.html" class="text-brand-500 hover:text-accent-600 transition-colors">Home</a>
                <a href="login.html" class="text-brand-500 hover:text-accent-600 transition-colors">Member Login</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md">
            <p class="text-center text-sm text-brand-700 bg-white border border-accent-500 rounded-lg px-4 py-3">Demo — member portal coming soon</p>

            <div class="mt-8 bg-white border border-brand-100 rounded-lg shadow-sm p-6 sm:p-8">
                <h1 class="font-serif text-2xl text-brand-900 text-center">Member Login</h1>
                <div class="w-12 h-px bg-accent-500 mx-auto my-5"></div>

                <form id="login-form" autocomplete="off" novalidate class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm text-brand-600 mb-1">Email</label>
                        <input id="email" type="email" class="w-full rounded-md border border-brand-200 bg-white px-3 py-2 text-sm text-brand-900 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label for="password" class="block text-sm text-brand-600 mb-1">Password</label>
                        <input id="password" type="password" class="w-full rounded-md border border-brand-200 bg-white px-3 py-2 text-sm text-brand-900 focus:outline-none focus:border-brand-500">
                    </div>
                    <button type="submit" class="w-full rounded-md bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium px-4 py-2 transition-colors">Sign in</button>
                </form>

                <p id="login-message" role="status" aria-live="polite" class="hidden mt-4 text-sm text-center text-brand-600"></p>
            </div>
        </div>
    </main>

    <footer class="py-6 px-6 text-center text-xs text-brand-400">
        <p>Private family office. We do not solicit or accept outside capital or clients.</p>
        <p class="mt-1">&copy; Fractional Equity</p>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();
            document.getElementById('password').value = '';
            var message = document.getElementById('login-message');
            message.textContent = 'Member portal coming soon. This is a demo; nothing was sent or stored.';
            message.classList.remove('hidden');
        });
    </script>
</body>
</html>
